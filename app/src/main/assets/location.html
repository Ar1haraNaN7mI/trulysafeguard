<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>位置模拟</title>
<style>
:root{color-scheme:light;--bg:#f3f6f3;--paper:#fff;--ink:#172d29;--muted:#435e55;--teal:#006959;--line:#cfddd4;--pale:#e2efe7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "DM Sans","Noto Sans CJK SC",system-ui,sans-serif}
main{max-width:840px;margin:auto;padding:12px clamp(12px,3vw,28px) 32px}
button,input{font:inherit;color:inherit}
button{min-height:44px;cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 13px;font-weight:600}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #cb7715;outline-offset:2px}
button:active:not(:disabled),.dir.held{background:#c4e2d0}
header,.row,.split,.coords,.move,.presets,.form{display:flex;gap:10px;align-items:center}
header{justify-content:space-between;margin-bottom:12px}
h1,h2,p{margin:0}
h1{font-size:clamp(24px,6vw,34px);letter-spacing:-.035em}
h2{font-size:17px}
.bar{display:flex;padding:4px;border:1px solid var(--line);border-radius:14px;background:#e9efea;margin-bottom:10px}
.bar button{width:50%;border:0;background:transparent;color:var(--muted)}
.bar button[aria-pressed=true]{background:var(--paper);color:var(--teal);box-shadow:0 1px 4px #163a281c}
.card{padding:15px;background:var(--paper);border:1px solid var(--line);border-radius:16px;margin:10px 0}
.split{justify-content:space-between;gap:6px}
.help,.tag{color:var(--muted);font-size:14px}
.coords{flex-wrap:wrap;gap:4px 15px;margin:6px 0;font-size:14px;font-variant-numeric:tabular-nums}
.plot{background:#e8f1e9;border-radius:10px;overflow:hidden}
canvas{display:block;width:100%;height:112px}
.move{justify-content:center;gap:clamp(10px,7vw,48px);padding:10px 0 2px}
#pad{width:clamp(142px,40vw,190px);aspect-ratio:1;position:relative;border:2px solid #70a995;border-radius:50%;touch-action:none;user-select:none;-webkit-user-select:none;background:radial-gradient(circle,#cbe3d4 0 32%,transparent 33%),linear-gradient(90deg,transparent 49.6%,#accaba 49.7% 50.3%,transparent 50.4%),linear-gradient(0deg,transparent 49.6%,#accaba 49.7% 50.3%,transparent 50.4%),#e6f1e9}
#pad:before{content:"";position:absolute;inset:13%;border:1px dashed #9cbeaa;border-radius:50%}
.axis{position:absolute;color:#3e6555;font-size:12px;font-weight:700;pointer-events:none}
.n{top:3px;left:50%;transform:translateX(-50%)}.s{bottom:3px;left:50%;transform:translateX(-50%)}.w{left:5px;top:50%;transform:translateY(-50%)}.e{right:5px;top:50%;transform:translateY(-50%)}
#knob{position:absolute;left:50%;top:50%;width:29%;height:29%;border-radius:50%;background:var(--teal);border:3px solid #fff;box-shadow:0 2px 5px #17392b42;transform:translate(-50%,-50%);pointer-events:none}
.arrows{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,40px);gap:1px}
.dir{padding:0;min-height:40px;touch-action:none;user-select:none;-webkit-user-select:none;font-size:20px}
.dir[data-d=n]{grid-area:1/2}.dir[data-d=w]{grid-area:2/1}.dir[data-d=e]{grid-area:2/3}.dir[data-d=s]{grid-area:3/2}
.readout{font-size:14px;font-variant-numeric:tabular-nums;color:var(--teal);font-weight:650}
.form{gap:8px;align-items:end;flex-wrap:wrap;margin-top:8px}
label{font-size:14px;color:var(--muted)}
.form label{flex:1;min-width:104px}
input[type=number]{width:100%;height:44px;margin-top:3px;border:1px solid #aebfb5;border-radius:8px;background:white;padding:6px 10px;font-variant-numeric:tabular-nums}
.speed{display:grid;grid-template-columns:1fr 86px;gap:12px;align-items:center}
input[type=range]{width:100%;accent-color:var(--teal);margin:0;min-height:44px}
.presets{gap:7px;flex-wrap:wrap}.presets button{font-size:14px;min-height:40px}
.presets button[aria-pressed=true]{color:var(--teal);background:var(--pale);border-color:#77a993}
.actions{margin:11px 0 0;display:flex;gap:8px;flex-wrap:wrap}
.hold-line{display:flex;align-items:center;gap:8px;min-height:44px;font-size:16px;color:var(--ink);font-weight:600}
.hold-line input{width:20px;height:20px;accent-color:var(--teal)}
.primary{background:var(--teal);color:white;border-color:var(--teal);flex:1}
.primary:active:not(:disabled){background:#005244}
.activeStop{background:#733f2d;border-color:#733f2d}
#message{margin:6px 0;color:var(--muted);min-height:1.35em;font-size:14px}
[hidden]{display:none!important}
@media(max-width:360px){.arrows{grid-template-columns:repeat(3,38px)}.card{padding:11px}.move{gap:5px}main{padding:8px}}
@media(min-width:670px){.body-grid{display:grid;grid-template-columns:1.12fr 1fr;gap:10px;align-items:start}.body-grid .card{margin:0}.settings .card+.card{margin-top:10px}canvas{height:155px}}
</style>
</head>
<body><main>
<header><h1>位置模拟</h1><button id="back" type="button">返回</button></header>
<div class="bar" role="group" aria-label="模拟模式">
<button id="previewMode" aria-pressed="true">本地预览</button><button id="deviceMode" aria-pressed="false">手机模拟</button>
</div>
<div class="card">
<div class="split"><h2 id="trackTitle">预览轨迹</h2><span class="tag" id="scale">网格 10 米</span></div>
<div class="coords"><span id="lat">纬度 0.000000</span><span id="lon">经度 0.000000</span></div>
<div class="plot"><canvas id="plot" role="img" aria-label="本次移动轨迹，地图上方为北">坐标见上方。</canvas></div>
</div>
<div class="body-grid">
<section class="card">
<div class="split"><h2>移动摇杆</h2><span id="motion" class="readout">静止 · 0 km/h</span></div>
<div class="move">
<div id="pad" role="group" aria-label="移动摇杆" tabindex="0" aria-describedby="padHelp"><span class="axis n">北</span><span class="axis e">东</span><span class="axis s">南</span><span class="axis w">西</span><span id="knob"></span></div>
<div class="arrows" role="group" aria-label="方向按钮">
<button type="button" class="dir" data-d="n" aria-label="向北移动">↑</button><button type="button" class="dir" data-d="w" aria-label="向西移动">←</button>
<button type="button" class="dir" data-d="e" aria-label="向东移动">→</button><button type="button" class="dir" data-d="s" aria-label="向南移动">↓</button>
</div></div>
<p class="help" id="padHelp">按住并拖动，推得越远越快，松手停止。也可按方向钮或键盘方向键。</p>
</section>
<div class="settings">
<section class="card"><h2>速度上限</h2>
<div class="speed"><input id="speed" type="range" min="0" max="300" step="1" value="5" aria-label="调节速度上限"><label>km/h<input id="speedValue" aria-label="速度上限，千米每小时" type="number" inputmode="decimal" min="0" max="300" step="0.1" value="5"></label></div>
<div class="presets" role="group" aria-label="速度预设"><button data-speed="5">步行 5</button><button data-speed="18">骑行 18</button><button data-speed="60">驾车 60</button></div>
</section>
<section class="card"><h2>起点</h2><div class="form">
<label>纬度<input id="startLat" aria-label="起点纬度" type="number" step="any" min="-90" max="90" value="0"></label>
<label>经度<input id="startLon" aria-label="起点经度" type="number" step="any" min="-180" max="180" value="0"></label>
</div><button id="origin" type="button">用当前位置作起点</button><p id="originStatus" class="help" role="status"></p></section></div></div>
<section class="card" id="holdCard" hidden><label class="hold-line"><input type="checkbox" id="hold">切到其他应用时保持最后位置</label>
<p class="help">开启后，离开此页会停止移动，手机保持最后坐标。可从通知或此页停止模拟。关闭时，离页结束模拟。</p></section>
<div class="actions"><button id="toggle" class="primary">开始预览</button><button id="settings" hidden>模拟位置设置</button></div>
<p id="message" role="status" aria-live="polite">预览仅在此页面移动。</p>
</main>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const R = 6371008.8, rad = Math.PI / 180;
  const dirs = {n:[0,1], e:[1,0], s:[0,-1], w:[-1,0]};
  const keys = {ArrowUp:'n',ArrowRight:'e',ArrowDown:'s',ArrowLeft:'w'};
  const arrowButtons = Array.from(document.querySelectorAll('.dir'));
  const presets = Array.from(document.querySelectorAll('[data-speed]'));
  const held = new Map();
  let mode='preview', preview=false, active=false, available=false, hold=false, stateMessage='';
  let limit=5, east=0, north=0, stickId=null, joyX=0, joyY=0;
  let point={lat:0,lon:0}, trail=[{x:0,y:0}], lastTick=performance.now(), nextAction=null, stopDeadline=0;
  const bridge=window.GuardLocation;
  const hasBridge=!!bridge && typeof bridge.state==='function';
  let originPending=false;
  window.guardOriginResult=(coords,message)=>{
    if(!originPending)return;
    originPending=false;
    if(Array.isArray(coords)&&coords.slice(0,2).every(Number.isFinite)&&!running()){
      $('startLat').value=String(Number(coords[0].toFixed(7)));
      $('startLon').value=String(Number(coords[1].toFixed(7)));
      remember(coords[0],coords[1],true);
      $('originStatus').textContent='已填入当前位置，估计精度约 '+Math.round(coords[2])+' 米。可编辑后开始。';
    }else $('originStatus').textContent=message||'未取得位置，请重试或手动填写。';
    syncControls();
  };
  $('origin').onclick=()=>{
    if(running()||originPending)return;
    originPending=true;syncControls();$('originStatus').textContent='正在获取当前位置…';
    if(hasBridge && typeof bridge.realOrigin==='function'){
      try{bridge.realOrigin();}catch(e){window.guardOriginResult(null,'未能请求定位。');}
    }else if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(p=>window.guardOriginResult([p.coords.latitude,p.coords.longitude,p.coords.accuracy],''),
        ()=>window.guardOriginResult(null,'浏览器未提供位置，请检查授权或手动填写。'),
        {enableHighAccuracy:true,maximumAge:30000,timeout:22000});
    }else window.guardOriginResult(null,'当前浏览器没有提供定位接口，请手动填写起点。');
  };
  let previousPoll=0,lastMotionSent=0,displayedNotice='';
  function notice(t) { if(t!==displayedNotice){displayedNotice=t;$('message').textContent=t;} }
  function running(){return mode==='preview' ? preview : active && !nextAction;}
  function remember(lat,lon,reset) {
    if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)return;
    if(reset){trail=[{x:0,y:0}];}
    else if(point.lat===lat && point.lon===lon){return;}
    else {
      const old=trail[trail.length-1];
      const dl=((lon-point.lon+540)%360)-180;
      trail.push({x:old.x+R*dl*rad*Math.cos((lat+point.lat)*rad/2),y:old.y+R*(lat-point.lat)*rad});
      if(trail.length>600)trail.shift();
    }
    point={lat,lon};
    $('lat').textContent='纬度 '+lat.toFixed(6);$('lon').textContent='经度 '+lon.toFixed(6);
    draw();
  }
  function draw() {
    const c=$('plot'), box=c.getBoundingClientRect(), w=Math.round(box.width),h=Math.round(box.height);
    if(!w||!h)return;
    const dpr=Math.min(window.devicePixelRatio||1,3);
    if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);}
    const g=c.getContext('2d');if(!g)return;
    g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    for(const p of trail){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);}
    const meters=Math.max(.3,(maxX-minX)/Math.max(1,w-48),(maxY-minY)/Math.max(1,h-40));
    const ux=x=>w/2+(x-(minX+maxX)/2)/meters, uy=y=>h/2-(y-(minY+maxY)/2)/meters;
    const target=meters*36, power=Math.pow(10,Math.floor(Math.log10(target)));
    const unit=([1,2,5,10].find(s=>s*power>=target)||10)*power, px=unit/meters;
    const mod=(a,b)=>((a%b)+b)%b;
    g.strokeStyle='#c0d3c4';g.lineWidth=1;g.beginPath();
    for(let x=mod(ux(0),px);x<w;x+=px){g.moveTo(x,0);g.lineTo(x,h);}
    for(let y=mod(uy(0),px);y<h;y+=px){g.moveTo(0,y);g.lineTo(w,y);}
    g.stroke();g.strokeStyle='#006959';g.lineWidth=2.5;g.beginPath();
    trail.forEach((p,i)=>{if(!i)g.moveTo(ux(p.x),uy(p.y));else g.lineTo(ux(p.x),uy(p.y));});g.stroke();
    const last=trail[trail.length-1];g.fillStyle='#006959';g.beginPath();g.arc(ux(last.x),uy(last.y),5,0,2*Math.PI);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();
    g.font='bold 13px sans-serif';g.fillStyle='#416450';g.fillText('↑ 北',10,20);
    $('scale').textContent='网格 '+(unit>=1000?unit/1000+' 千米':unit+' 米');
  }
  function syncControls() {
    const phone=mode==='device', live=running();
    $('previewMode').setAttribute('aria-pressed',String(!phone));$('deviceMode').setAttribute('aria-pressed',String(phone));
    $('trackTitle').textContent=phone?'手机模拟轨迹':'预览轨迹';
    $('toggle').textContent=nextAction?'正在停止…':(live?'停止':'开始')+(phone?'手机模拟':'预览');
    $('toggle').disabled=originPending||!!nextAction||(phone&&!active&&!available);
    $('origin').disabled=originPending||live||!!nextAction;
    $('toggle').classList.toggle('activeStop',live);$('settings').hidden=!phone;$('settings').disabled=!hasBridge;
    $('holdCard').hidden=!phone;$('hold').checked=hold;$('hold').disabled=!hasBridge||typeof bridge.setHold!=='function';
    $('startLat').disabled=live||!!nextAction;$('startLon').disabled=live||!!nextAction;
    $('pad').setAttribute('aria-disabled',String(!live));
    arrowButtons.forEach(b=>{b.disabled=!live;});
  }
  function sendMovement(x,y,speed) {
    if(mode==='device'&&hasBridge&&active){
      try{bridge.setMotion(x,y,speed);lastMotionSent=performance.now();}catch(e){notice('移动指令未生效，请检查手机模拟状态。');}
    }
  }
  function paintMotion() {
    let x=joyX,y=joyY;
    for(const key of new Set(held.values())){x+=dirs[key][0];y+=dirs[key][1];}
    const size=Math.hypot(x,y);if(size>1){x/=size;y/=size;}
    east=x;north=y;
    $('knob').style.left=(50+east*34)+'%';$('knob').style.top=(50-north*34)+'%';
    for(const b of arrowButtons)b.classList.toggle('held',Array.from(held.values()).includes(b.dataset.d));
    const speed=limit*Math.hypot(east,north);
    const heading=['北','东北','东','东南','南','西南','西','西北'][(Math.round(Math.atan2(east,north)*4/Math.PI)+8)%8];
    $('motion').textContent=speed>.001?heading+' · '+Number(speed.toFixed(1))+' km/h':'静止 · 0 km/h';
    sendMovement(east,north,size?limit:0);
  }
  function center(){stickId=null;joyX=0;joyY=0;held.clear();paintMotion();lastTick=performance.now();}
  function readState() {
    if(!hasBridge)return null;
    try{const s=JSON.parse(bridge.state());return s&&typeof s.active==='boolean'?s:null;}catch(e){return null;}
  }
  function poll(initial) {
    const s=readState(), was=active, priorMessage=stateMessage;
    if(!s){available=false;if(active){center();active=false;}if(mode==='device')notice('无法读取手机模拟状态。');syncControls();return;}
    available=s.available===true;active=s.active;hold=s.hold===true;stateMessage=typeof s.message==='string'?s.message:'';
    if(initial&&active)mode='device';
    if(mode==='device'&&active)remember(s.lat,s.lon,initial||!was);
    if(was&&!active){center();if(mode==='device')notice(stateMessage||'手机模拟已停止。');}
    if(nextAction&&!active){const after=nextAction;nextAction=null;after();return;}
    if(nextAction&&performance.now()>stopDeadline){nextAction=null;notice('停止尚未确认，请重试。');}
    if(mode==='device'&&!available&&(initial||priorMessage!==stateMessage))notice('请先点“模拟位置设置”，在开发者选项中选择“隐私守护”。');
    syncControls();
  }
  function stopThen(after) {
    center();
    if(!active||!hasBridge){after();return;}
    nextAction=after;stopDeadline=performance.now()+2500;syncControls();
    try{bridge.stop();}catch(e){nextAction=null;notice('手机模拟停止失败。');syncControls();return;}
    poll(false);
  }
  function setMode(next) {
    mode=next;preview=false;center();
    remember(point.lat,point.lon,true);
    if(mode==='device'){poll(false);notice(available?(stateMessage||'按开始后，将使用所填起点模拟手机位置。'):'请先点“模拟位置设置”，在开发者选项中选择“隐私守护”。');}
    else notice('预览仅在此页面移动。');
    syncControls();
  }
  function selectMode(next){
    if(next===mode||nextAction)return;
    if(mode==='device'&&active){stopThen(()=>setMode(next));return;}
    setMode(next);
  }
  $('previewMode').onclick=()=>selectMode('preview');$('deviceMode').onclick=()=>selectMode('device');
  function startPoint() {
    const lat=$('startLat'),lon=$('startLon');
    for(const f of [lat,lon]){
      if(!f.value.trim()||!Number.isFinite(f.valueAsNumber)||!f.validity.valid){
        notice(f===lat?'纬度需在 −90 至 90 之间。':'经度需在 −180 至 180 之间。');f.focus();return null;
      }
    }
    return {lat:lat.valueAsNumber,lon:lon.valueAsNumber};
  }
  $('toggle').onclick=()=>{
    if(nextAction)return;
    if(running()){
      if(mode==='device')stopThen(()=>{notice('手机模拟已停止。');syncControls();});
      else {center();preview=false;notice('预览已停止。');syncControls();}
      return;
    }
    const p=startPoint();if(!p)return;
    center();
    if(mode==='preview'){preview=true;remember(p.lat,p.lon,true);notice('预览中，手机位置保持原样。');}
    else if(hasBridge){
      try{if(!bridge.start(p.lat,p.lon)){poll(false);notice(stateMessage||'无法启动，请检查模拟位置授权。');return;}}
      catch(e){notice('启动失败，请检查模拟位置授权。');return;}
      remember(p.lat,p.lon,true);poll(false);notice(active?'手机模拟已启动。':(stateMessage||'正在启动手机模拟。'));
    }
    syncControls();
  };
  $('settings').onclick=()=>{center();try{if(hasBridge)bridge.settings();}catch(e){notice('无法打开系统开发者选项。');}};
  $('hold').onchange=e=>{
    const requested=e.target.checked;
    center();
    try{
      const accepted=hasBridge&&bridge.setHold(requested);
      poll(false);
      if(!accepted||hold!==requested)notice(stateMessage||'设置未生效，请检查通知权限后重试。');
      else notice(hold?'离页后保持最后位置，可从通知停止。':'离开此页时将结束手机模拟。');
    }catch(err){poll(false);notice('无法更改保持位置设置。');}
  };
  function leave(){center();preview=false;if(hasBridge){try{bridge.close();return;}catch(e){notice('请使用系统返回键关闭。');}}
    syncControls();if(history.length>1)history.back();else{window.close();notice('已停止预览，可以关闭此页。');}}
  $('back').onclick=leave;
  function setLimit(v,fromField) {
    if(!Number.isFinite(v))return;
    limit=Math.round(clamp(v,0,300)*10)/10;$('speed').value=String(Math.round(limit));
    if(!fromField)$('speedValue').value=String(limit);
    for(const b of presets)b.setAttribute('aria-pressed',String(Number(b.dataset.speed)===limit));
    paintMotion();
  }
  $('speed').oninput=e=>setLimit(Number(e.target.value),false);
  $('speedValue').oninput=e=>{if(e.target.value!==''&&e.target.validity.valid)setLimit(e.target.valueAsNumber,true);};
  $('speedValue').onchange=e=>setLimit(e.target.value===''?limit:e.target.valueAsNumber,false);
  presets.forEach(b=>b.onclick=()=>setLimit(Number(b.dataset.speed),false));
  const pad=$('pad');
  function updateStick(e) {
    const r=pad.getBoundingClientRect(),reach=Math.max(1,Math.min(r.width,r.height)*.34);
    let x=(e.clientX-r.left-r.width/2)/reach,y=-(e.clientY-r.top-r.height/2)/reach;
    const amp=Math.hypot(x,y);if(amp>1){x/=amp;y/=amp;}if(amp<.045){x=0;y=0;}
    joyX=x;joyY=y;paintMotion();
  }
  pad.onpointerdown=e=>{
    if(!running()||stickId!==null||e.button!==0)return;
    e.preventDefault();pad.focus({preventScroll:true});stickId=e.pointerId;
    try{pad.setPointerCapture(e.pointerId);}catch(ignored){}updateStick(e);
  };
  pad.onpointermove=e=>{if(e.pointerId===stickId)updateStick(e);};
  function release(e){
    let changed=held.delete('p'+e.pointerId);
    if(stickId===e.pointerId){stickId=null;joyX=0;joyY=0;changed=true;}
    if(changed)paintMotion();
  }
  document.addEventListener('pointerup',release,true);document.addEventListener('pointercancel',release,true);
  pad.onlostpointercapture=release;
  for(const b of arrowButtons){
    b.onpointerdown=e=>{if(!running()||e.button!==0)return;e.preventDefault();
      try{b.setPointerCapture(e.pointerId);}catch(ignored){}held.set('p'+e.pointerId,b.dataset.d);paintMotion();};
    b.onlostpointercapture=release;
    b.onclick=e=>{if(e.detail!==0||!running())return;const token=Symbol('step');held.set(token,b.dataset.d);paintMotion();
      setTimeout(()=>{if(held.delete(token))paintMotion();},240);};
  }
  document.addEventListener('keydown',e=>{
    if(!running()||e.altKey||e.ctrlKey||e.metaKey||e.target instanceof HTMLInputElement)return;
    const d=keys[e.key]||((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('dir')?e.target.dataset.d:null);
    if(!d)return;e.preventDefault();if(!e.repeat){held.set('k'+e.key,d);paintMotion();}
  });
  document.addEventListener('keyup',e=>{if(held.delete('k'+e.key)){e.preventDefault();paintMotion();}});
  function movePreview(dt) {
    const distance=limit/3.6*Math.hypot(east,north)*dt;if(distance<=0)return;
    const d=distance/R, lat=point.lat*rad, br=Math.atan2(east,north);
    const destLat=Math.asin(clamp(Math.sin(lat)*Math.cos(d)+Math.cos(lat)*Math.sin(d)*Math.cos(br),-1,1));
    const dl=Math.atan2(Math.sin(br)*Math.sin(d)*Math.cos(lat),Math.cos(d)-Math.sin(lat)*Math.sin(destLat));
    remember(destLat/rad,((point.lon+dl/rad+540)%360)-180,false);
  }
  window.addEventListener('blur',center);
  document.addEventListener('visibilitychange',()=>{center();if(!document.hidden&&mode==='device')poll(false);});
  window.addEventListener('pagehide',center);
  window.addEventListener('resize',draw);
  setInterval(()=>{
    const now=performance.now(),dt=Math.min(.25,Math.max(0,(now-lastTick)/1000));lastTick=now;
    if(document.hidden)return;
    if(mode==='preview'&&preview)movePreview(dt);
    if(mode==='device'&&running()&&(east||north)&&limit>0&&now-lastMotionSent>=200)
      sendMovement(east,north,limit);
    if((mode==='device'||nextAction)&&now-previousPoll>350){previousPoll=now;poll(false);}
  },70);
  setLimit(limit,false);poll(true);syncControls();draw();
})();
</script>
</body>
